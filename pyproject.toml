[tool.poetry]
name = "textmancy"
version = "0.3.0"
description = "LLM-driven package for mapping, analyzing and expanding text works."
authors = ["Caleb Case <caleb.case93@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
thefuzz = "^0.20.0"
pydantic-ai-slim = {version = "^2.54.0", extras = ["openai"]}
anthropic = {version = ">=1.9.0", optional = true}
google-genai = {version = ">=2.25.0", optional = true}

[tool.poetry.extras]
anthropic = ["anthropic"]
google = ["google-genai"]

[tool.poetry.group.dev.dependencies]
bump2version = "^1.0.1"
pytest = "^7.4.3"
towncrier = "^23.10.0"
python-dotenv = "^1.0.0"
flake8 = "^7.0.0"
pytest-cov = "^4.1.0"
pre-commit = "^3.7.0"
black = "^24.4.2"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = ["--cov=textmancy", "--cov-report=term-missing"]

[tool.coverage.run]
omit = ["tests/*", "targets.py", "*/__init__.py"]
